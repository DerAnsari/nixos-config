    community_ids = [
        "tauon",
        "pywalfox",
        "discord",
        "neovim",
        "obsidian",
        "heroiclauncher",
        "steam",
        "obs",
        "zathura",
        "papirus-icons",
        "bat",
        "lazygit",
        "yazi"
    ]

[wallpaper]
