[bar.default]
border = "primary"
border_width = 2.0
center = [ "active_window" ]
color = "tertiary"
concave_edge_corners = false
end = [
    "clock",
    "tray",
    "spacer_1",
    "audio_visualizer",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_edge = 10
margin_ends = 10
radius = 0
start = [
    "launcher",
    "wallpaper",
    "power_profile",
    "clipboard",
    "notifications",
    "spacer_3",
    "cpu",
    "spacer_2",
    "workspaces",
    "spacer_4",
    "media"
]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-widget-0000000000000002",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004"
]

